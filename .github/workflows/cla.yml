name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Ce workflow tourne depuis la branche de base et n'execute jamais le code de la
# pull request : aucune etape ne fait de checkout.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Signature du CLA
        if: >-
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
          github.event_name == 'pull_request_target'
        # v2.6.1. Le depot de l'action est archive : on la fige sur ce commit.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/Dubplex-Audio/dubplex-siren-core/blob/main/CLA.md
          # Les signatures vivent sur une branche a part, non protegee.
          branch: cla-signatures
          allowlist: bot*,dependabot[bot]
